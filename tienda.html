<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VocaSport</title>
    <link rel="stylesheet" href="styles.css">

    <link rel="stylesheet" href="tienda.css">

    <link rel="stylesheet" href="responsive.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

    <header class="navbar">

        <div class="logo">
    <a href="index.html">
        <img src="img/logo.png" alt="VocaSport">
    </a>
</div>

        <nav class="menu">

    <a href="index.html">Inicio</a>
    <a href="deportes.html">Deportes</a>
    <a href="eventos.html">Eventos</a>
    <a href="historias.html">Historias</a>
    <a href="tienda.html">Tienda</a>

</nav>

<div class="acciones-header">

    <button class="btn-registro">

        <i class="fa-regular fa-circle-user"></i>

        Registro

    </button>

    <button class="btn-carrito" onclick="abrirCarrito()">

        <i class="fa-solid fa-cart-shopping"></i>

        <span id="contadorCarrito">0</span>

    </button>

</div>

</header>



<section class="busqueda-tienda">

    <input
        type="text"
        id="buscarProducto"
        placeholder="🔍 Buscar productos..."
        autocomplete="off">

</section>

<section class="categorias-tienda">

    <button class="activo" data-categoria="Todos">
        Todos
    </button>

    <button data-categoria="Mujer">
        Mujer
    </button>

    <button data-categoria="Hombre">
        Hombre
    </button>

    <button data-categoria="Roller Derby">
        Roller Derby
    </button>

    <button data-categoria="Ultimate Frisbee">
        Ultimate Frisbee
    </button>

    <button data-categoria="BMX Flatland">
        BMX Flatland
    </button>

    <button data-categoria="Bike Polo">
        Bike Polo
    </button>

    <button data-categoria="Roundnet">
        Roundnet
    </button>

</section>

<section id="catalogoProductos"
class="catalogo-productos">

</section>









<div id="modalProducto" class="modal-producto">

    <div class="contenido-producto">

        <span class="cerrar-producto" onclick="cerrarProducto()">
            &times;
        </span>

        <div class="producto-grid">

            <div class="producto-imagen">

                <img
                id="imagenProducto"
                src=""
                alt="Producto">

            </div>

            <div class="producto-info">

                <h2 id="nombreProducto"></h2>

                <p id="marcaProducto" class="marca-modal"></p>

                <h3 id="precioProducto"></h3>

                <p id="descripcionProducto"></p>

                <div class="opciones-producto">

                    <div>

                        <label>Talla</label>

                        <select id="tallaProducto">

                            <option>S</option>
                            <option>M</option>
                            <option>L</option>
                            <option>XL</option>

                        </select>

                    </div>

                    <div>

                        <label>Cantidad</label>

                        <input
                        type="number"
                        id="cantidadProducto"
                        value="1"
                        min="1">

                    </div>

                </div>

                <button
                class="btn-comprar"
                onclick="agregarCarrito()">

                    🛒 Agregar al carrito

                </button>

            </div>

        </div>

    </div>

</div>

<div id="carrito" class="carrito">

    <div class="carrito-header">

        <h2>

            🛒 Mi carrito

        </h2>

        <span onclick="cerrarCarrito()">

            ✕

        </span>

    </div>

    <div
    id="listaCarrito"
    class="lista-carrito">

    </div>

    <div class="total-carrito">

        <h3>

            Total:

            <span id="totalCarrito">

                $0

            </span>

        </h3>

        <button
class="btn-finalizar"
onclick="irCheckout()">

    Finalizar compra

</button>

    </div>

</div>

<div id="notificacion" class="notificacion">

    ✔ Producto agregado al carrito

</div>

<footer class="footer">

    <div class="footer-contenido">

        <div class="footer-columna">

            <p>Contáctate con nosotros</p>
            <p>Política de privacidad</p>
            <p>Términos de uso</p>
            <p>Evoca Tienda</p>

        </div>

        <div class="footer-columna">

            <p>Ajuste de cookies</p>

            <p>Redes sociales</p>

        <div class="social-icons">

    <a href="https://facebook.com" target="_blank">
        <i class="fa-brands fa-facebook-f"></i>
    </a>

    <a href="https://instagram.com" target="_blank">
        <i class="fa-brands fa-instagram"></i>
    </a>

    <a href="https://tiktok.com" target="_blank">
        <i class="fa-brands fa-tiktok"></i>
    </a>

    <a href="https://youtube.com" target="_blank">
        <i class="fa-brands fa-youtube"></i>
    </a>

</div>
        </div>

    </div>

    <div class="footer-copy">
        © 2026 EvocaSport. Todos los derechos reservados.
    </div>

</footer>

<script src="tienda.js"></script>


<script src="checkout.js"></script>

</body>

</html>
